name: Compiler la version Windows

on:
  push:
    branches: [main]
    paths: ['www/**', 'desktop/**', 'assets/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Numéro de version
        shell: bash
        run: |
          BASE=$(cat VERSION)
          DEPUIS=$(git log -1 --format=%H -- VERSION)
          CORRECTIF=$(git rev-list --count "$DEPUIS"..HEAD)
          echo "APP_VERSION=$BASE.$CORRECTIF" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Fabriquer l'installateur et la version portable
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          node copy-www.mjs
          npx electron-builder --win nsis portable --x64 --publish never
          ls -la dist

      - name: Garder les fichiers comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: pliage-windows
          path: |
            desktop/dist/*.exe

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ env.APP_VERSION }}
          name: Pliage pour Windows ${{ env.APP_VERSION }}
          body: |
            **Pliage-installation-${{ env.APP_VERSION }}.exe** : installe Pliage sur le PC (raccourci sur le bureau et dans le menu Démarrer, « Ouvrir avec Pliage » pour les PDF).
            **Pliage-portable-${{ env.APP_VERSION }}.exe** : se lance directement, sans installation (sur une clé USB par exemple).

            Windows peut afficher « Windows a protégé votre ordinateur » car l'appli n'est pas signée : clique sur **Informations complémentaires**, puis **Exécuter quand même**.
          files: desktop/dist/*.exe
          make_latest: false
