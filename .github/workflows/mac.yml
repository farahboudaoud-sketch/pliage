name: Compiler la version Mac

on:
  push:
    branches: [main]
    paths: ['www/**', 'desktop/**', 'assets/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Numéro de version
        run: echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Installer les dépendances (${{ matrix.arch }})
        working-directory: desktop
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: npm install --no-audit --no-fund

      - name: Fabriquer le .dmg (${{ matrix.arch }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          node copy-www.mjs
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pliage-mac-${{ matrix.arch }}
          path: desktop/dist/*.dmg

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Numéro de version
        run: echo "APP_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dmg
          merge-multiple: true
      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ env.APP_VERSION }}
          name: Pliage pour Mac ${{ env.APP_VERSION }}
          body: |
            **Pliage-${{ env.APP_VERSION }}-arm64.dmg** : pour les Mac avec puce Apple (M1, M2, M3, M4…), soit la plupart des Mac depuis fin 2020.
            **Pliage-${{ env.APP_VERSION }}-x64.dmg** : pour les Mac avec processeur Intel.
            (Menu  › À propos de ce Mac : la ligne « Puce » ou « Processeur » indique lequel prendre.)

            Ouvre le .dmg et glisse Pliage dans Applications. Au premier lancement, macOS bloque l'appli car elle n'est pas signée par Apple : va dans **Réglages Système › Confidentialité et sécurité**, puis clique sur **Ouvrir quand même** en bas de la page.
            Si macOS dit que l'appli « est endommagée », ouvre le Terminal et tape : `xattr -cr /Applications/Pliage.app`, puis relance-la.
          files: dmg/*.dmg
          make_latest: false
